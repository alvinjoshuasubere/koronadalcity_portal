<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1A1A2E">
    <title>Koronadal City Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F3F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .loader { text-align: center; }
        .spinner { width: 48px; height: 48px; border: 4px solid #A83D5C; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message { color: #5C5C6F; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="message">Loading Koronadal City Portal...</div>
    </div>
    <script>
        window.location.href = 'https://koronadalcityonlineservices.com/';
    </script>
</body>
</html>
